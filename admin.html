<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>⚙ 峇露露休閒農場 - 後端管理系統</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f1eb; color: #333; padding: 20px; margin: 0; }
        .container { display: flex; max-width: 1200px; margin: 0 auto; gap: 30px; }
        .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .form-area { flex: 1; min-width: 350px; height: fit-content; }
        .list-area { flex: 2; }
        h2 { color: #2C4A3E; margin-top: 0; border-bottom: 2px solid #2C4A3E; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 0.9rem; }
        input, textarea, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        textarea { height: 70px; resize: none; }
        .upload-row { display: flex; gap: 10px; margin-top: 5px; }
        .upload-row input[type="file"] { padding: 5px; font-size: 0.85rem; }
        #imgPreview { width: 100px; height: 100px; object-fit: cover; display: none; margin-top: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .btn { width: 100%; border: none; padding: 12px; border-radius: 6px; font-size: 1.1rem; cursor: pointer; font-weight: bold; transition: 0.2s; color: white; }
        .btn-add { background: #D97706; }
        .btn-add:hover { background: #b45309; }
        .btn-cat { background: #4b5563; padding: 10px; font-size: 1rem; }
        .btn-cat:hover { background: #374151; }
        .btn-update { background: #2C4A3E; display: none; }
        .btn-cancel { background: #888; display: none; margin-top: 8px; }
        
        .dish-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid #eee; }
        .dish-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; margin-right: 15px; }
        .dish-info { flex: 1; }
        .dish-title { font-weight: bold; font-size: 1.1rem; }
        .dish-meta { font-size: 0.85rem; color: #666; }
        .action-btns { display: flex; gap: 8px; }
        .btn-sm { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; color: white; }
        .btn-edit { background: #0284c7; }
        .btn-del { background: #dc2626; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #2C4A3E; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="form-area">
        <div class="box">
            <h2>📁 新增菜品分類</h2>
            <form action="/api/categories" method="POST">
                <div class="form-group">
                    <label>輸入新分類名稱</label>
                    <input type="text" name="newCategory" placeholder="例如：主廚激推排餐" required>
                </div>
                <button type="submit" class="btn btn-cat">✨ 建立新分類</button>
            </form>
        </div>

        <div class="box">
            <h2 id="form-title">⚙ 新增菜品</h2>
            <form id="dishForm" action="/api/dishes" method="POST">
                <input type="hidden" id="dishId">
                <div class="form-group">
                    <label>菜品分類</label>
                    <select name="category" id="category" required></select>
                </div>
                <div class="form-group">
                    <label>菜品名稱</label>
                    <input type="text" name="name" id="name" required>
                </div>
                <div class="form-group">
                    <label>餐點售價 (NT$)</label>
                    <input type="number" name="price" id="price" required>
                </div>
                
                <div class="form-group">
                    <label>菜品圖片 (可手動貼網址，或點下方上傳)</label>
                    <input type="text" name="img" id="img" placeholder="https://..." oninput="updatePreview(this.value)">
                    <div class="upload-row">
                        <input type="file" id="localFile" accept="image/*" onchange="handleImageUpload(this)">
                    </div>
                    <img id="imgPreview" alt="圖片預覽">
                </div>

                <div class="form-group">
                    <label>菜品特色描述</label>
                    <textarea name="desc" id="desc" required></textarea>
                </div>
                
                <button type="submit" id="submitBtn" class="btn btn-add">➕ 確認新增至前台菜單</button>
                <button type="button" id="updateBtn" class="btn btn-update" onclick="submitUpdate()">💾 儲存修改</button>
                <button type="button" id="cancelBtn" class="btn btn-cancel" onclick="resetForm()">取消修改</button>
            </form>
            <a href="/index.html" class="back-link">← 回到農場前台首頁</a>
        </div>
    </div>

    <div class="box list-area">
        <h2>📋 目前菜單列表</h2>
        <div id="admin-list">載入中...</div>
    </div>
</div>

<script>
    let allDishes = [];

    // 自動圖片預覽
    function updatePreview(url) {
        const imgEl = document.getElementById('imgPreview');
        if (url) {
            imgEl.src = url;
            imgEl.style.display = 'block';
        } else {
            imgEl.style.display = 'none';
        }
    }

    // 核心功能：處理照片選擇後，直接非同步外傳至免費圖床
    async function handleImageUpload(input) {
        if (!input.files || !input.files[0]) return;
        
        const file = input.files[0];
        const formData = new FormData();
        formData.append('imageFile', file);

        const imgInput = document.getElementById('img');
        imgInput.placeholder = "正在上傳照片至免費雲端圖床...";
        imgInput.value = "";

        try {
            const response = await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            
            if (result.success) {
                // 上傳成功，將永久網址填入欄位
                imgInput.value = result.imgUrl;
                updatePreview(result.imgUrl);
                alert('圖片成功上傳至雲端圖床！');
            } else {
                alert('圖片上傳失敗：' + result.message);
                imgInput.placeholder = "https://...";
            }
        } catch (err) {
            alert('上傳發生錯誤，請重試！');
            imgInput.placeholder = "https://...";
        }
    }

    async function loadCategories() {
        try {
            const response = await fetch('/api/categories');
            const categories = await response.json();
            const selectEl = document.getElementById('category');
            selectEl.innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
        } catch (err) { console.error('無法載入分類選項'); }
    }

    async function loadAdminMenu() {
        try {
            const response = await fetch('/api/dishes');
            allDishes = await response.json();
            const listDiv = document.getElementById('admin-list');
            
            if(allDishes.length === 0) {
                listDiv.innerHTML = '<p>目前菜單空空如也。</p>';
                return;
            }

            listDiv.innerHTML = allDishes.map(dish => `
                <div class="dish-item">
                    <img src="${dish.img}" alt="">
                    <div class="dish-info">
                        <div class="dish-title">${dish.name}</div>
                        <div class="dish-meta">[${dish.category}] - NT$ ${dish.price}</div>
                        <div style="font-size:0.85rem; color:#888; margin-top:4px;">${dish.desc}</div>
                    </div>
                    <div class="action-btns">
                        <button class="btn-sm btn-edit" onclick="startEdit(${dish.id})">修改</button>
                        <button class="btn-sm btn-del" onclick="deleteDish(${dish.id}, '${dish.name}')">刪除</button>
                    </div>
                </div>
            `).join('');
        } catch (err) { document.getElementById('admin-list').innerHTML = '無法載入列表'; }
    }

    function startEdit(id) {
        const dish = allDishes.find(d => d.id === id);
        if (!dish) return;

        document.getElementById('form-title').innerText = "✏️ 修改菜品";
        document.getElementById('dishId').value = dish.id;
        document.getElementById('category').value = dish.category;
        document.getElementById('name').value = dish.name;
        document.getElementById('price').value = dish.price;
        document.getElementById('img').value = dish.img;
        updatePreview(dish.img);
        document.getElementById('desc').value = dish.desc;

        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('updateBtn').style.display = 'block';
        document.getElementById('cancelBtn').style.display = 'block';
        
        document.getElementById('dishForm').onsubmit = (e) => e.preventDefault();
    }

    async function submitUpdate() {
        const id = document.getElementById('dishId').value;
        const updatedData = {
            category: document.getElementById('category').value,
            name: document.getElementById('name').value,
            price: document.getElementById('price').value,
            img: document.getElementById('img').value,
            desc: document.getElementById('desc').value
        };

        const res = await fetch(`/api/dishes/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedData)
        });
        const result = await res.json();
        if(result.success) {
            alert('菜品修改成功！');
            resetForm();
            loadAdminMenu();
        }
    }

    async function deleteDish(id, name) {
        if (!confirm(`確定要永久刪除「${name}」這道菜嗎？`)) return;
        const res = await fetch(`/api/dishes/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if(result.success) {
            alert('菜品已成功刪除！');
            loadAdminMenu();
        }
    }

    function resetForm() {
        document.getElementById('form-title').innerText = "⚙ 新增菜品";
        document.getElementById('dishForm').reset();
        document.getElementById('imgPreview').style.display = 'none';
        document.getElementById('submitBtn').style.display = 'block';
        document.getElementById('updateBtn').style.display = 'none';
        document.getElementById('cancelBtn').style.display = 'none';
        document.getElementById('dishForm').onsubmit = null;
    }

    window.onload = async function() {
        await loadCategories();
        await loadAdminMenu();
    };
</script>
</body>
</html>
